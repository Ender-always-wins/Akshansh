<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="icon" type="image/png" href="/Akshansh/images/coffee.png">
    <link rel = "stylesheet" href = "/Akshansh/styles.css">
</head>
<body>
    <nav class = "top" id = "nav-blogs">
        <a class = "top-buttons" id = "back" href = "/Akshansh/blogs.html" style = "margin-right:100px;">
            Go back
        </a>
    </nav>
    <div style = "display:flex;">
        <div id = "main"></div>
        <script>
            // fill the main div
            let params = new URLSearchParams(window.location.search);
            document.getElementsByTagName("title")[0].textContent = params.get("blog");
            let blog = params.get("blog");
            fetch(`https://akshansh-api.onrender.com/blogs/${blog}`).then(res => res.text()).then(data => {
                document.getElementById("main").innerHTML = data.replaceAll("\"","");
            });
            // add next and previous buttons
            async function addButtons(){
                let names = await fetch("https://akshansh-api.onrender.com/blog-names");
                let namesJson = await names.json();
                let blogIndex= namesJson[blog];
                if (blogIndex == 1){
                    const newElement = document.createElement("a");
                    newElement.classList.add("top-buttons");
                    let lastBlog = "";
                    for (var key in namesJson){
                        if (namesJson[key] == Object.keys(namesJson).length){
                            lastBlog = key;
                        }
                    }
                    newElement.href = "/Akshansh/blogs/index.html?blog=" + lastBlog;
                    newElement.textContent = "Last";
                    document.getElementById("nav-blogs").appendChild(newElement);
                }
                else {
                    const newElement = document.createElement("a");
                    newElement.classList.add("top-buttons");
                    let previousBlog = "";
                    for (var key in namesJson){
                        if (namesJson[key] == blogIndex - 1){
                            previousBlog = key;
                        }
                    }
                    newElement.href = "/Akshansh/blogs/index.html?blog=" + previousBlog;
                    newElement.textContent = "Previous";
                    document.getElementById("nav-blogs").appendChild(newElement);
                }

                let current = document.createElement("a");
                current.classList.add("top-buttons");
                current.textContent = blog;
                document.getElementById("nav-blogs").appendChild(current);

                if (blogIndex == Object.keys(namesJson).length) {
                    const newElement = document.createElement("a");
                    newElement.classList.add("top-buttons");
                    let firstBlog = "";
                    for (var key in namesJson){
                        if (namesJson[key] == 1){
                            firstBlog = key;
                        }
                    }
                    newElement.href = "/Akshansh/blogs/index.html?blog=" + firstBlog;
                    newElement.textContent = "First"
                    document.getElementById("nav-blogs").appendChild(newElement);
                }
                else {
                    const newElement = document.createElement("a");
                    newElement.classList.add("top-buttons");
                    let nextBlog = "";
                    for (var key in namesJson){
                        if (namesJson[key] == blogIndex + 1){
                            nextBlog = key;
                        }
                    }
                    newElement.href = "/Akshansh/blogs/index.html?blog=" + nextBlog;
                    newElement.textContent = "Next"
                    document.getElementById("nav-blogs").appendChild(newElement);
                }
            }
            addButtons();
        </script>
    </div>
</body>
</html>
